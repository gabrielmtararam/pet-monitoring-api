name: Tests & Codecov Coverage

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: devuser
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: devdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov model-bakery

      - name: Run Tests & Generate XML Report
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: devdb
          DB_USER: devuser
          DB_PASS: devpassword
          SECRET_KEY: testing-github-actions-secret-key-12345
          GEMINI_API_KEY: dummy-key-to-pass-checks
        run: |
          pytest vet_exams/ --cov=vet_exams --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: gabrielmtararam/pet-monitoring-api
          files: ./coverage.xml
          fail_ci_if_error: false
