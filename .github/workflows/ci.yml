name: Continuous Integration (API)

on:
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  ci-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-django
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint with ruff
        run: |
          # ruff check .
          echo "Linting placeholder (ruff check .)"
      - name: Run Tests
        run: |
          # python manage.py test
          echo "Testing placeholder (python manage.py test)"
